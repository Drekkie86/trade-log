name: Temporary PR69 review export

on:
  push:
    branches:
      - review-export-pr69-3ce6b093

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact review SHA
        uses: actions/checkout@v4
        with:
          ref: 3ce6b0932c1e6943e7a68efee65d99f91fed822c
          fetch-depth: 1

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3ce6b0932c1e6943e7a68efee65d99f91fed822c"

      - name: Package exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/christiania-pr69-source-3ce6b093.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: christiania-pr69-source-3ce6b093
          path: ${{ runner.temp }}/christiania-pr69-source-3ce6b093.tar.gz
          if-no-files-found: error
          retention-days: 1


  collect-gate-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Collect PR69 quality-gate run index and failed-step logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate-history"
          gh run list             --repo Drekkie86/trade-log             --branch christiania-perf-deploy-hardening-v1             --workflow "Christiania Quality Gate"             --limit 100             --json databaseId,number,headSha,status,conclusion,displayTitle,event,createdAt,updatedAt,url             > "$RUNNER_TEMP/gate-history/run-index.json"

          jq -r '.[] | select(.conclusion == "failure") | .databaseId'             "$RUNNER_TEMP/gate-history/run-index.json"             | while read -r run_id; do
                gh run view "$run_id"                   --repo Drekkie86/trade-log                   --log-failed                   > "$RUNNER_TEMP/gate-history/run-${run_id}-failed.log"                   2>&1 || true
              done

          gh run view 36490912304             --repo Drekkie86/trade-log             --json databaseId,number,headSha,status,conclusion,jobs,url,createdAt,updatedAt             > "$RUNNER_TEMP/gate-history/run-464-success.json"

      - name: Upload gate history
        uses: actions/upload-artifact@v4
        with:
          name: christiania-pr69-gate-history
          path: ${{ runner.temp }}/gate-history
          if-no-files-found: error
          retention-days: 1
