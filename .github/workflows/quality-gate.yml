name: Christiania Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate-windows:
    name: Windows / Python 3.13
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache CI virtual environment
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: christiania-ci-venv-v2-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-ci.txt') }}

      - name: Ensure CI dependencies
        shell: pwsh
        run: |
          if ("${{ steps.venv-cache.outputs.cache-hit }}" -ne "true") {
            python -m venv .venv
            .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --no-compile -r requirements-ci.txt
          }
          if (-not (Test-Path .\.venv\Scripts\python.exe)) {
            throw "CI virtual environment is missing its Python executable."
          }
          .\.venv\Scripts\python.exe -m pip check

      - name: Run Christiania quality gate
        shell: pwsh
        env:
          PYTEST_ADDOPTS: "--durations=25 --durations-min=0.5"
          CHRISTIANIA_CORE_TEST_BUDGET_SECONDS: "180"
          CHRISTIANIA_SLOW_TEST_BUDGET_SECONDS: "30"
        run: |
          .\.venv\Scripts\python.exe .\quality_gate.py --ci

  release-smoke-linux:
    name: Ubuntu / release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache CI virtual environment
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: christiania-ci-venv-v2-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-ci.txt') }}

      - name: Ensure CI dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.venv-cache.outputs.cache-hit }}" != "true" ]]; then
            python -m venv .venv
            .venv/bin/python -m pip install --disable-pip-version-check --no-compile -r requirements-ci.txt
          fi
          test -x .venv/bin/python
          .venv/bin/python -m pip check

      - name: Validate release and maintenance shell syntax
        shell: bash
        run: |
          bash -n deploy/receive_release.sh
          bash -n deploy/christiania-maintenance

      - name: Run release safety regressions
        shell: bash
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_release_database_migration_v1.py \
            tests/test_release_deployment_v1.py
